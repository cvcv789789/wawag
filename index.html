<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>刮紙辨識 V1 - GitHub Pages 測試版 測試版</title>
  <style>

:root{
  --bg:#0b1220; --card:#121c2e; --card2:#18253a; --text:#f7f9fc;
  --muted:#aebbd0; --accent:#4f8cff; --good:#39c77a; --bad:#ff6767; --warn:#ffc857;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
body{min-height:100vh}
.app{width:min(720px,100%);margin:auto;padding:16px 14px 40px}
header{padding:8px 2px 14px}
h1{margin:0 0 5px;font-size:26px}
header p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.controls{display:grid;gap:12px}
.photoChoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.galleryBtn{background:#6b5cff}
.uploadBtn,button{min-height:48px;border:0;border-radius:14px;font-size:16px;font-weight:700;padding:0 15px;display:flex;align-items:center;justify-content:center}
.uploadBtn{background:var(--accent);color:white}
.uploadBtn input{display:none}
button{background:#274262;color:white}
button.primary{background:var(--good)}
button.secondary{background:#23324a}
button:disabled{opacity:.45}
.field{display:grid;gap:7px}
.field label{font-size:14px;color:var(--muted)}
.field input[type=number]{height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:var(--card2);color:white;font-size:20px;padding:0 12px}
.field input[type=range]{width:100%}
.viewerHelp{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:10px}
.viewer{position:relative;height:min(56vh,500px);min-height:330px;background:#050910;border-radius:16px;overflow:hidden;touch-action:none}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.crosshair{position:absolute;inset:0;pointer-events:none}
.crosshair .h,.crosshair .v{position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 4px #000}
.crosshair .h{height:2px;width:70px;left:50%;top:50%;transform:translate(-50%,-50%)}
.crosshair .v{width:2px;height:70px;left:50%;top:50%;transform:translate(-50%,-50%)}
.crosshair .ring{position:absolute;width:54px;height:54px;border:2px solid var(--warn);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.actionRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.templatePreviewWrap{display:flex;gap:14px;align-items:center;margin-top:12px;background:var(--card2);padding:10px;border-radius:14px}
#templateCanvas{border-radius:50%;border:2px solid var(--warn);background:#000}
.smallTitle{font-size:13px;color:var(--muted);margin-bottom:4px}
.statusText{font-weight:700}
.actionStatus{margin-top:10px;padding:10px 12px;border-radius:12px;background:#0c1628;color:#cbd5e1;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:var(--card2);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.stats span{font-size:13px;color:var(--muted)}
.stats b{font-size:24px}
.result h2{margin-top:0}
#resultNote{color:var(--muted);line-height:1.55}
.note p{margin-bottom:0;color:var(--muted);line-height:1.55;font-size:14px}
.hidden{display:none!important}
@media(max-width:420px){
  .photoChoice{grid-template-columns:1fr 1fr}
  .photoChoice .uploadBtn{font-size:15px;padding:0 8px}
  .app{padding-left:10px;padding-right:10px}
  .actionRow{grid-template-columns:1fr}
  .viewer{min-height:300px}
}

</style>
</head>
<body>
  <main class="app">
    <header>
      <h1>刮紙辨識 V1 - GitHub Pages 測試版</h1>
      <p>手機網頁版｜拍照/相簿 → 輸入完整刮數 → 對準未刮格 → 辨識</p>
    </header>

    <section class="card controls">
      <div class="photoChoice">
        <label class="uploadBtn">
          📷 直接拍照
          <input id="cameraInput" type="file" accept="image/*" capture="environment" />
        </label>
        <label class="uploadBtn galleryBtn">
          🖼️ 從相簿選擇
          <input id="fileInput" type="file" accept="image/*" />
        </label>
      </div>
      <button id="sampleBtn" class="secondary">載入範例照片</button>

      <div class="field">
        <label for="totalInput">完整刮數</label>
        <input id="totalInput" type="number" inputmode="numeric" min="1" value="60" />
      </div>

      <div class="field">
        <label for="threshold">未刮相似度門檻 <span id="thresholdValue">78%</span></label>
        <input id="threshold" type="range" min="55" max="95" value="78" />
      </div>
    </section>

    <section class="card viewerCard">
      <div class="viewerHelp">
        <b>選未刮樣本：</b>用雙指放大/縮小，單指拖曳，把一個「未刮黑色圓圈」移到中央準星。
      </div>

      <div id="viewer" class="viewer">
        <canvas id="canvas"></canvas>
        <div class="crosshair">
          <span class="h"></span><span class="v"></span><span class="ring"></span>
        </div>
      </div>

      <div class="actionRow">
        <button id="setTemplateBtn" disabled>🎯 設定未刮樣本</button>
        <button id="analyzeBtn" class="primary" disabled>▶ 開始辨識</button>
      </div>
      <div id="actionStatus" class="actionStatus">請先上傳照片</div>

      <div id="templatePreviewWrap" class="templatePreviewWrap hidden">
        <div>
          <div class="smallTitle">未刮樣本</div>
          <canvas id="templateCanvas" width="96" height="96"></canvas>
        </div>
        <div id="sampleStatus" class="statusText">尚未設定</div>
      </div>
    </section>

    <section id="resultCard" class="card result hidden">
      <h2>辨識結果</h2>
      <div class="stats">
        <div><span>完整刮數</span><b id="rTotal">-</b></div>
        <div><span>照片中偵測格數</span><b id="rDetected">-</b></div>
        <div><span>判定未刮</span><b id="rUn">-</b></div>
        <div><span>判定已刮</span><b id="rScratched">-</b></div>
      </div>
      <p id="resultNote"></p>
      <button id="toggleOverlayBtn" class="secondary">切換框線顯示</button>
    </section>

    <section class="card note">
      <b>V1 測試限制</b>
      <p>這版先針對你提供的「10 欄排列刮紙」測試。照片越正、圓圈越清楚越準。若只拍到部分刮紙，會只統計照片內推測得到的格子。</p>
    </section>
  </main>

  <script>

const fileInput = document.getElementById('fileInput');
const cameraInput = document.getElementById('cameraInput');
const sampleBtn = document.getElementById('sampleBtn');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', {willReadFrequently:true});
const viewer = document.getElementById('viewer');
const setTemplateBtn = document.getElementById('setTemplateBtn');
const analyzeBtn = document.getElementById('analyzeBtn');
const templateCanvas = document.getElementById('templateCanvas');
const tctx = templateCanvas.getContext('2d', {willReadFrequently:true});
const templatePreviewWrap = document.getElementById('templatePreviewWrap');
const sampleStatus = document.getElementById('sampleStatus');
const threshold = document.getElementById('threshold');
const thresholdValue = document.getElementById('thresholdValue');
const totalInput = document.getElementById('totalInput');
const resultCard = document.getElementById('resultCard');
const rTotal = document.getElementById('rTotal');
const rDetected = document.getElementById('rDetected');
const rUn = document.getElementById('rUn');
const rScratched = document.getElementById('rScratched');
const resultNote = document.getElementById('resultNote');
const toggleOverlayBtn = document.getElementById('toggleOverlayBtn');
const actionStatus = document.getElementById('actionStatus');

let img = new Image();
let imageReady = false;
let processCanvas = document.createElement('canvas');
let processCtx = processCanvas.getContext('2d', {willReadFrequently:true});
let processScale = 1;
let scale = 1, offsetX = 0, offsetY = 0;
let baseW = 0, baseH = 0;
let template = null;
let overlay = [];
let showOverlay = true;
let pointers = new Map();
let lastPinchDist = 0;
let lastMid = null;

threshold.addEventListener('input', ()=>thresholdValue.textContent = threshold.value + '%');

function fitImage(){
  if(!imageReady) return;
  const vw = viewer.clientWidth, vh = viewer.clientHeight;
  scale = Math.min(vw/baseW, vh/baseH);
  offsetX = (vw-baseW*scale)/2;
  offsetY = (vh-baseH*scale)/2;
  draw();
}

function draw(){
  if(!imageReady) return;
  const dpr = window.devicePixelRatio || 1;
  const vw = viewer.clientWidth, vh = viewer.clientHeight;
  canvas.width = Math.round(vw*dpr);
  canvas.height = Math.round(vh*dpr);
  canvas.style.width = vw+'px'; canvas.style.height = vh+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,vw,vh);
  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);
  ctx.drawImage(img,0,0,baseW,baseH);
  if(showOverlay && overlay.length){
    ctx.lineWidth = Math.max(2/scale,1);
    ctx.font = `${Math.max(12/scale,6)}px sans-serif`;
    overlay.forEach((o,i)=>{
      ctx.strokeStyle = o.state==='un' ? '#37d67a' : o.state==='scr' ? '#ff5f5f' : '#ffc857';
      ctx.beginPath();
      ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
      ctx.stroke();
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fillText(String(i+1), o.x-o.r*.5, o.y-o.r*1.15);
    });
  }
  ctx.restore();
}

function loadFile(file){
  if(!file) return;
  const url = URL.createObjectURL(file);
  img = new Image();
  img.onload = ()=>{
    baseW = img.naturalWidth; baseH = img.naturalHeight;

    // iPhone Safari can fail when a full 12MP image is copied into another canvas.
    // Keep a smaller processing canvas (max 1400 px) for sampling/analysis.
    const maxProcess = 1400;
    processScale = Math.min(1, maxProcess / Math.max(baseW, baseH));
    processCanvas.width = Math.max(1, Math.round(baseW * processScale));
    processCanvas.height = Math.max(1, Math.round(baseH * processScale));
    processCtx.clearRect(0,0,processCanvas.width,processCanvas.height);
    processCtx.drawImage(img, 0, 0, processCanvas.width, processCanvas.height);

    imageReady = true; template = null; overlay=[];
    setTemplateBtn.disabled=false;
    analyzeBtn.disabled=true;
    templatePreviewWrap.classList.add('hidden');
    resultCard.classList.add('hidden');
    actionStatus.textContent='照片已載入。請把未刮黑圈移到中央黃色準星，再按「設定未刮樣本」。';
    fitImage();
    URL.revokeObjectURL(url);
  };
  img.src=url;
}
fileInput.addEventListener('change', e=>loadFile(e.target.files[0]));
cameraInput.addEventListener('change', e=>loadFile(e.target.files[0]));

function screenToImage(sx,sy){
  return {x:(sx-offsetX)/scale, y:(sy-offsetY)/scale};
}

function getCrosshairImagePos(){
  const x = viewer.clientWidth/2;
  const y = viewer.clientHeight/2;
  return screenToImage(x,y);
}

function clampPan(){
  const vw=viewer.clientWidth, vh=viewer.clientHeight;
  const iw=baseW*scale, ih=baseH*scale;
  if(iw <= vw) offsetX=(vw-iw)/2;
  else offsetX=Math.min(0,Math.max(vw-iw,offsetX));
  if(ih <= vh) offsetY=(vh-ih)/2;
  else offsetY=Math.min(0,Math.max(vh-ih,offsetY));
}

viewer.addEventListener('pointerdown', e=>{
  viewer.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
});
viewer.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId) || !imageReady) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const pts=[...pointers.values()];
  if(pts.length===1){
    offsetX += e.clientX-prev.x;
    offsetY += e.clientY-prev.y;
    clampPan(); draw();
  } else if(pts.length===2){
    const [a,b]=pts;
    const dist=Math.hypot(a.x-b.x,a.y-b.y);
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if(lastPinchDist && lastMid){
      const oldScale=scale;
      let next=scale*(dist/lastPinchDist);
      next=Math.max(.2,Math.min(8,next));
      const ix=(lastMid.x-offsetX)/oldScale, iy=(lastMid.y-offsetY)/oldScale;
      scale=next;
      offsetX=mid.x-ix*scale; offsetY=mid.y-iy*scale;
      clampPan(); draw();
    }
    lastPinchDist=dist; lastMid=mid;
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2){lastPinchDist=0;lastMid=null;}
}
viewer.addEventListener('pointerup',endPointer);
viewer.addEventListener('pointercancel',endPointer);

viewer.addEventListener('wheel',e=>{
  if(!imageReady) return;
  e.preventDefault();
  const rect=viewer.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const old=scale;
  const factor=e.deltaY<0?1.12:.89;
  scale=Math.max(.2,Math.min(8,scale*factor));
  const ix=(mx-offsetX)/old, iy=(my-offsetY)/old;
  offsetX=mx-ix*scale; offsetY=my-iy*scale;
  clampPan(); draw();
},{passive:false});

function cropPatch(cx,cy,size){
  // Work on the reduced processing canvas for mobile stability.
  const pcx = cx * processScale;
  const pcy = cy * processScale;
  const ps = Math.max(12, Math.round(size * processScale));
  const x = Math.max(0, Math.round(pcx-ps/2));
  const y = Math.max(0, Math.round(pcy-ps/2));
  const w = Math.max(1, Math.min(ps, processCanvas.width-x));
  const h = Math.max(1, Math.min(ps, processCanvas.height-y));
  return {data:processCtx.getImageData(x,y,w,h),x,y,w,h};
}

function statsFromPatch(imageData){
  const d=imageData.data;
  let sum=0,sum2=0,dark=0,count=0;
  let rs=0,gs=0,bs=0;
  for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],b=d[i+2];
    const gray=.299*r+.587*g+.114*b;
    sum+=gray; sum2+=gray*gray; count++;
    rs+=r;gs+=g;bs+=b;
    if(gray<85) dark++;
  }
  const mean=sum/count;
  const variance=Math.max(0,sum2/count-mean*mean);
  return {mean, std:Math.sqrt(variance), darkRatio:dark/count,
          r:rs/count,g:gs/count,b:bs/count};
}

setTemplateBtn.addEventListener('click',()=>{
  if(!imageReady){
    actionStatus.textContent='請先上傳照片。';
    return;
  }
  try{
    const p=getCrosshairImagePos();
    if(p.x<0 || p.y<0 || p.x>baseW || p.y>baseH){
      actionStatus.textContent='黃色準星目前在照片外，請先把照片移到準星下方。';
      return;
    }

    // Sample slightly larger than before so the full black circle is captured.
    const size=Math.max(38, Math.min(baseW,baseH)*0.07);
    const patch=cropPatch(p.x,p.y,size);
    const st=statsFromPatch(patch.data);

    // Warn when the chosen area does not look dark enough.
    template={...patch, stats:st};
    tctx.clearRect(0,0,96,96);
    const tmp=document.createElement('canvas');
    tmp.width=patch.w; tmp.height=patch.h;
    tmp.getContext('2d').putImageData(patch.data,0,0);
    tctx.drawImage(tmp,0,0,96,96);
    templatePreviewWrap.classList.remove('hidden');

    sampleStatus.textContent=`已設定｜黑色比例 ${(st.darkRatio*100).toFixed(0)}%`;
    analyzeBtn.disabled=false;

    if(st.darkRatio < 0.28){
      actionStatus.textContent='⚠️ 樣本已設定，但看起來不夠黑。建議把完整未刮黑圈更準確地移到黃色準星後重新設定。';
    }else{
      actionStatus.textContent='✅ 未刮樣本設定成功。現在可以按「開始辨識」。';
    }
  }catch(err){
    console.error(err);
    actionStatus.textContent='❌ 樣本設定失敗。請重新選照片，或先把照片縮小一點再試。';
    alert('設定未刮樣本失敗：' + (err?.message || err));
  }
});

function toGraySmall(maxW=1100){
  const ratio2=Math.min(1,maxW/processCanvas.width);
  const w=Math.max(1,Math.round(processCanvas.width*ratio2));
  const h=Math.max(1,Math.round(processCanvas.height*ratio2));
  const c=document.createElement('canvas'); c.width=w;c.height=h;
  const cctx=c.getContext('2d',{willReadFrequently:true});
  cctx.drawImage(processCanvas,0,0,w,h);
  const im=cctx.getImageData(0,0,w,h), d=im.data;
  const gray=new Uint8Array(w*h);
  for(let i=0,j=0;i<d.length;i+=4,j++) gray[j]=Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2]);
  // ratio maps original-image coordinates to this small canvas
  const ratio = processScale * ratio2;
  return {gray,w,h,ratio};
}

function connectedComponents(binary,w,h){
  const seen=new Uint8Array(w*h), comps=[];
  const qx=new Int32Array(w*h), qy=new Int32Array(w*h);
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    let idx=y*w+x;
    if(!binary[idx]||seen[idx]) continue;
    let head=0,tail=0; qx[tail]=x;qy[tail]=y;tail++; seen[idx]=1;
    let minx=x,maxx=x,miny=y,maxy=y,n=0,sx=0,sy=0;
    while(head<tail){
      const cx=qx[head],cy=qy[head];head++;n++;sx+=cx;sy+=cy;
      if(cx<minx)minx=cx;if(cx>maxx)maxx=cx;if(cy<miny)miny=cy;if(cy>maxy)maxy=cy;
      for(let yy=cy-1;yy<=cy+1;yy++) for(let xx=cx-1;xx<=cx+1;xx++){
        if(xx===cx&&yy===cy)continue;
        const ni=yy*w+xx;
        if(xx>0&&yy>0&&xx<w-1&&yy<h-1&&binary[ni]&&!seen[ni]){
          seen[ni]=1; qx[tail]=xx;qy[tail]=yy;tail++;
        }
      }
    }
    comps.push({n,minx,maxx,miny,maxy,cx:sx/n,cy:sy/n,w:maxx-minx+1,h:maxy-miny+1});
  }
  return comps;
}

function detectDarkCircles(){
  const {gray,w,h,ratio}=toGraySmall();
  const binary=new Uint8Array(w*h);
  // adaptive-ish threshold based on percentile sample
  let hist=new Uint32Array(256);
  for(let i=0;i<gray.length;i+=4) hist[gray[i]]++;
  let total=0; for(const v of hist) total+=v;
  let acc=0,p25=60;
  for(let i=0;i<256;i++){acc+=hist[i]; if(acc>=total*.25){p25=i;break;}}
  const th=Math.min(105,Math.max(45,p25+12));
  for(let i=0;i<gray.length;i++) binary[i]=gray[i]<th?1:0;

  const comps=connectedComponents(binary,w,h);
  const minDim=Math.min(w,h);
  let cand=comps.filter(c=>{
    const ar=c.w/c.h;
    const areaBox=c.w*c.h;
    const fill=c.n/areaBox;
    return c.w>minDim*.018 && c.w<minDim*.12 &&
           c.h>minDim*.018 && c.h<minDim*.12 &&
           ar>.65 && ar<1.45 && fill>.28 && fill<.95;
  });
  // Remove obvious text/noise by favoring repeated size.
  if(!cand.length) return [];
  const sizes=cand.map(c=>(c.w+c.h)/2).sort((a,b)=>a-b);
  const med=sizes[Math.floor(sizes.length/2)];
  cand=cand.filter(c=>{
    const s=(c.w+c.h)/2;
    return s>med*.55 && s<med*1.7;
  });
  return cand.map(c=>({x:c.cx/ratio,y:c.cy/ratio,r:((c.w+c.h)/4)/ratio}));
}

function cluster1D(values, expectedGap=null){
  values=[...values].sort((a,b)=>a-b);
  if(values.length===0)return [];
  let diffs=[]; for(let i=1;i<values.length;i++) diffs.push(values[i]-values[i-1]);
  diffs=diffs.filter(d=>d>2).sort((a,b)=>a-b);
  const medDiff=diffs.length?diffs[Math.floor(diffs.length/2)]:10;
  const tol=expectedGap?expectedGap*.28:Math.max(8,medDiff*.55);
  const clusters=[];
  for(const v of values){
    let c=clusters.find(c=>Math.abs(c.mean-v)<=tol);
    if(!c){clusters.push({vals:[v],mean:v});}
    else{c.vals.push(v); c.mean=c.vals.reduce((a,b)=>a+b,0)/c.vals.length;}
  }
  return clusters.map(c=>c.mean).sort((a,b)=>a-b);
}

function inferGrid(circles,total){
  if(!circles.length) return [];
  const cols = total%10===0 ? 10 : Math.round(Math.sqrt(total*1.6));
  const rows = Math.ceil(total/cols);

  // Estimate x/y centers from circle candidates.
  let xs=cluster1D(circles.map(c=>c.x));
  let ys=cluster1D(circles.map(c=>c.y));

  // choose densest contiguous span approximating expected count
  function fitAxis(vals,n){
    if(vals.length>=n){
      let best=vals.slice(0,n),bestScore=Infinity;
      for(let i=0;i<=vals.length-n;i++){
        const seg=vals.slice(i,i+n);
        const gaps=seg.slice(1).map((v,j)=>v-seg[j]);
        const mean=gaps.reduce((a,b)=>a+b,0)/(gaps.length||1);
        const score=gaps.reduce((s,g)=>s+(g-mean)*(g-mean),0);
        if(score<bestScore){bestScore=score;best=seg;}
      }
      return best;
    }
    if(vals.length>=2){
      const min=vals[0],max=vals[vals.length-1];
      const step=(max-min)/(n-1);
      return Array.from({length:n},(_,i)=>min+i*step);
    }
    return vals;
  }

  xs=fitAxis(xs,cols);
  ys=fitAxis(ys,rows);
  if(xs.length<2||ys.length<2) return [];

  const rg = circles.map(c=>c.r).sort((a,b)=>a-b);
  const rr = rg[Math.floor(rg.length/2)] || Math.min(baseW/cols,baseH/rows)*.2;

  const grid=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const idx=r*cols+c; if(idx>=total) break;
    grid.push({x:xs[c],y:ys[r],r:rr});
  }
  return grid;
}

function similarity(a,b){
  // Designed to distinguish black opaque "un-scratched" circles from revealed/abraded circles.
  const dMean=Math.abs(a.mean-b.mean)/255;
  const dStd=Math.abs(a.std-b.std)/128;
  const dDark=Math.abs(a.darkRatio-b.darkRatio);
  const dRGB=(Math.abs(a.r-b.r)+Math.abs(a.g-b.g)+Math.abs(a.b-b.b))/(255*3);
  let score=1-(.25*dMean+.15*dStd+.5*dDark+.1*dRGB);
  return Math.max(0,Math.min(1,score));
}

function patchStatsAt(x,y,r){
  const size=Math.max(20,r*1.7);
  const p=cropPatch(x,y,size);
  return statsFromPatch(p.data);
}

analyzeBtn.addEventListener('click',()=>{
  if(!imageReady||!template) return;
  const total=Math.max(1,parseInt(totalInput.value||'60',10));
  const circles=detectDarkCircles();
  const grid=inferGrid(circles,total);
  if(grid.length<Math.min(total,6)){
    alert('目前無法穩定找到格子。請換一張拍得更正、刮紙佔畫面更大的照片再試。');
    return;
  }
  const th=parseInt(threshold.value,10)/100;
  overlay=grid.map(g=>{
    const st=patchStatsAt(g.x,g.y,g.r);
    const sim=similarity(st,template.stats);
    return {...g, sim, state: sim>=th?'un':'scr'};
  });

  const un=overlay.filter(o=>o.state==='un').length;
  const scr=overlay.filter(o=>o.state==='scr').length;
  rTotal.textContent=total;
  rDetected.textContent=overlay.length;
  rUn.textContent=un;
  rScratched.textContent=scr;
  const partial = overlay.length<total;
  resultNote.textContent = partial
    ? `照片目前只推測到 ${overlay.length} 個格子，因此「已刮」是照片範圍內的結果，不代表整張刮紙。`
    : `依目前門檻 ${threshold.value}% 判斷：未刮 ${un} 格、已刮 ${scr} 格。若框線判錯，可調整相似度後再辨識。`;
  resultCard.classList.remove('hidden');
  draw();
  resultCard.scrollIntoView({behavior:'smooth',block:'start'});
});

toggleOverlayBtn.addEventListener('click',()=>{showOverlay=!showOverlay;draw();});
window.addEventListener('resize',()=>{if(imageReady)fitImage();});

</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>刮紙辨識 V1.3.9P3 穩定版</title>
<style>
:root{
  --bg:#0b1220;--card:#121c2e;--card2:#19273b;--text:#f7f9fc;--muted:#aebbd0;
  --blue:#4f8cff;--green:#39c77a;--red:#ff6767;--yellow:#ffc857;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.app{max-width:820px;margin:auto;padding:14px 12px 40px}
h1{margin:5px 0;font-size:25px}.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.uploadBtn,button{min-height:48px;border:0;border-radius:14px;color:white;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 12px;cursor:pointer}
.uploadBtn{background:var(--blue)}.gallery{background:#6b5cff}.uploadBtn input{display:none}
button{background:#274262}button.primary{background:var(--green)}button.warn{background:#8a6500}button:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:6px;margin-top:12px}.field label{font-size:13px;color:var(--muted)}
.field input{width:100%;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:var(--card2);color:white;padding:0 12px;font-size:19px}
.help{font-size:14px;color:var(--muted);line-height:1.6}
.viewer{position:relative;height:min(62vh,560px);min-height:360px;background:#050910;border-radius:16px;overflow:hidden;touch-action:none;user-select:none}
#canvas{position:absolute;left:0;top:0;width:100%;height:100%;cursor:grab}
#canvas.dragging{cursor:grabbing}
.crosshair{position:absolute;inset:0;pointer-events:none;display:none}
.crosshair.show{display:block}
.crosshair:before,.crosshair:after{content:"";position:absolute;background:white;box-shadow:0 0 4px black}
.crosshair:before{width:70px;height:2px;left:50%;top:50%;transform:translate(-50%,-50%)}
.crosshair:after{height:70px;width:2px;left:50%;top:50%;transform:translate(-50%,-50%)}
.crosshair .ring{position:absolute;width:54px;height:54px;border:2px solid var(--yellow);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.status{margin-top:10px;padding:10px 12px;border-radius:12px;background:#0d1728;color:#cbd5e1;font-size:14px;line-height:1.5}
.sampleBox{display:flex;gap:12px;align-items:center;background:var(--card2);padding:10px;border-radius:14px;margin-top:10px}
#sampleCanvas{width:92px;height:92px;border-radius:12px;border:2px solid var(--yellow);background:black}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats div{background:var(--card2);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.stats span{color:var(--muted);font-size:13px}.stats b{font-size:24px}
.hidden{display:none!important}.mode{outline:2px solid var(--yellow)}
.small{font-size:12px;color:var(--muted)}
@media(max-width:430px){
  .row2{grid-template-columns:1fr 1fr}
  .row2 .uploadBtn,.row2 button{font-size:14px;padding:0 7px}
}
</style>
</head>
<body>
<main class="app">
  <h1>🎯 刮紙辨識 V1.3.9P3</h1>
  <div class="sub">手機 + 電腦版｜V1.3.9 </div>

  <section class="card">
    <div class="row2">
      <label class="uploadBtn">📷 直接拍照<input id="cameraInput" type="file" accept="image/*" capture="environment"></label>
      <label class="uploadBtn gallery">🖼️ 選擇照片<input id="fileInput" type="file" accept="image/*"></label>
    </div>

    <div class="field">
      <label>完整刮數</label>
      <input id="totalInput" type="number" inputmode="numeric" value="60" min="1">
    </div>
    <div class="field">
      <label>每行格數（左至右數）</label>
      <input id="colsInput" type="number" inputmode="numeric" value="10" min="1">
    </div>
    <div class="field">
      <label>刮膜形狀</label>
      <select id="shapeMode" style="height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:var(--card2);color:white;padding:0 12px;font-size:17px">
        <option value="circle">圓形</option>
        <option value="square">正方形</option>
      </select>
    </div>
    <div class="field">
      <label>自動局部修正上限(不準確在拉到最高) <span id="searchText">±15%</span></label>
      <input id="searchRange" type="range" min="0" max="25" value="15" step="5">
    </div>
    <div class="field">
      <label>反光容忍度 <span id="glareText">中</span></label>
      <input id="glareRange" type="range" min="0" max="2" value="1" step="1">
    </div>
  </section>

  <section class="card">
    <div class="help">
      <b>步驟 1：</b>按「四角透視校正」，依序點刮格區的 左上 → 右上 → 右下 → 左下。<br>
      <b>步驟 2：</b>按「選未刮樣本」，再把照片拖到中央準星，對準一個完整未刮黑圈。<br>
      <span class="small">手機：單指拖曳、雙指縮放。電腦：滑鼠拖曳、滾輪縮放。</span>
    </div>

    <div class="row2" style="margin:10px 0">
      <button id="roiBtn" class="warn" disabled>⌖ 四角透視校正</button>
      <button id="sampleModeBtn" disabled>🎯 選未刮樣本</button>
    </div>

    <div id="viewer" class="viewer">
      <canvas id="canvas"></canvas>
      <div id="crosshair" class="crosshair"><span class="ring"></span></div>
    </div>

    <div id="status" class="status">請先上傳照片。</div>

    <div id="sampleBox" class="sampleBox hidden">
      <canvas id="sampleCanvas" width="120" height="120"></canvas>
      <div>
        <b>目前未刮樣本</b>
        <div id="sampleText" class="help">尚未設定</div>
      </div>
    </div>

    <div class="row2" style="margin-top:12px">
      <button id="confirmSampleBtn" disabled>✅ 確認未刮樣本</button>
      <button id="analyzeBtn" class="primary" disabled>▶ 開始辨識</button>
    </div>
  </section>

  <section id="resultCard" class="card hidden">
    <h2 style="margin-top:0">辨識結果</h2>
    <div class="stats">
      <div><span>完整刮數</span><b id="rTotal">-</b></div>
      <div><span>辨識格數</span><b id="rDetected">-</b></div>
      <div><span>未刮</span><b id="rUn">-</b></div>
      <div><span>已刮</span><b id="rScr">-</b></div>
    </div>
    <p id="resultNote" class="help"></p>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const cameraInput=$('cameraInput'), fileInput=$('fileInput'), viewer=$('viewer'), canvas=$('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
const roiBtn=$('roiBtn'), sampleModeBtn=$('sampleModeBtn'), confirmSampleBtn=$('confirmSampleBtn'), analyzeBtn=$('analyzeBtn');
const crosshair=$('crosshair'), statusEl=$('status'), totalInput=$('totalInput'), colsInput=$('colsInput');
const searchRange=$('searchRange'), searchText=$('searchText'), glareRange=$('glareRange'), glareText=$('glareText'), shapeMode=$('shapeMode');
searchRange.addEventListener('input',()=>searchText.textContent='±'+searchRange.value+'%');
const glareNames=['低','中','高'];
glareRange.addEventListener('input',()=>glareText.textContent=glareNames[Number(glareRange.value)]);
const sampleBox=$('sampleBox'), sampleCanvas=$('sampleCanvas'), sctx=sampleCanvas.getContext('2d'), sampleText=$('sampleText');
const resultCard=$('resultCard'), rTotal=$('rTotal'), rDetected=$('rDetected'), rUn=$('rUn'), rScr=$('rScr'), resultNote=$('resultNote');

let img=new Image(), imageReady=false, baseW=0,baseH=0;
let scale=1,offsetX=0,offsetY=0;
let mode='pan'; // pan | roi | sample
let roi=null, roiStart=null, roiDrag=null;
let perspectivePoints=[];
let rectifiedCanvas=null;
let usePerspective=false;
let template=null, overlay=[];
let pointers=new Map(), lastPinchDist=0,lastMid=null;
let mouseDown=false,lastMouse=null;

function resizeCanvas(){
  const dpr=devicePixelRatio||1, w=viewer.clientWidth,h=viewer.clientHeight;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function fitImage(){
  if(!imageReady)return;
  resizeCanvas();
  const w=viewer.clientWidth,h=viewer.clientHeight;
  scale=Math.min(w/baseW,h/baseH);
  offsetX=(w-baseW*scale)/2;offsetY=(h-baseH*scale)/2;
  draw();
}
function draw(){
  if(!imageReady)return;
  resizeCanvas();
  const w=viewer.clientWidth,h=viewer.clientHeight;
  ctx.clearRect(0,0,w,h);
  ctx.save();ctx.translate(offsetX,offsetY);ctx.scale(scale,scale);ctx.drawImage(img,0,0,baseW,baseH);

  if(roi){
    ctx.strokeStyle='#ffc857';ctx.lineWidth=Math.max(3/scale,1);
    ctx.setLineDash([10/scale,8/scale]);ctx.strokeRect(roi.x,roi.y,roi.w,roi.h);ctx.setLineDash([]);
  }
  if(roiDrag){
    ctx.strokeStyle='#4f8cff';ctx.lineWidth=Math.max(3/scale,1);ctx.strokeRect(roiDrag.x,roiDrag.y,roiDrag.w,roiDrag.h);
  }
  if(perspectivePoints.length){
    ctx.save();
    ctx.strokeStyle='#ffd84d';
    ctx.fillStyle='#ffd84d';
    ctx.lineWidth=Math.max(3/scale,1);
    ctx.beginPath();
    perspectivePoints.forEach((p,i)=>{
      if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      ctx.beginPath();
      ctx.arc(p.x,p.y,Math.max(7/scale,3),0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#111';
      ctx.font=`${Math.max(16/scale,8)}px sans-serif`;
      ctx.fillText(String(i+1),p.x+8/scale,p.y-8/scale);
      ctx.fillStyle='#ffd84d';
    });
    if(perspectivePoints.length>1){
      ctx.beginPath();
      ctx.moveTo(perspectivePoints[0].x,perspectivePoints[0].y);
      for(let i=1;i<perspectivePoints.length;i++)ctx.lineTo(perspectivePoints[i].x,perspectivePoints[i].y);
      if(perspectivePoints.length===4)ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
  }
  overlay.forEach(o=>{
    ctx.strokeStyle=o.state==='un'?'#39c77a':'#ff6767';ctx.lineWidth=Math.max(2/scale,1);
    ctx.strokeRect(o.x,o.y,o.w,o.h);
  });
  ctx.restore();
}
function loadFile(file){
  if(!file)return;
  const url=URL.createObjectURL(file);
  img=new Image();
  img.onload=()=>{
    baseW=img.naturalWidth;baseH=img.naturalHeight;imageReady=true;roi=null;template=null;overlay=[];
    roiBtn.disabled=false;sampleModeBtn.disabled=true;confirmSampleBtn.disabled=true;analyzeBtn.disabled=true;
    crosshair.classList.remove('show');sampleBox.classList.add('hidden');resultCard.classList.add('hidden');
    statusEl.textContent='照片已載入。請先按「設定辨識範圍」。';
    fitImage();URL.revokeObjectURL(url);
  };
  img.src=url;
}
cameraInput.addEventListener('change',e=>loadFile(e.target.files[0]));
fileInput.addEventListener('change',e=>loadFile(e.target.files[0]));

function screenToImage(sx,sy){return{x:(sx-offsetX)/scale,y:(sy-offsetY)/scale}}
function clampPan(){
  const vw=viewer.clientWidth,vh=viewer.clientHeight,iw=baseW*scale,ih=baseH*scale;
  if(iw<=vw)offsetX=(vw-iw)/2;else offsetX=Math.min(0,Math.max(vw-iw,offsetX));
  if(ih<=vh)offsetY=(vh-ih)/2;else offsetY=Math.min(0,Math.max(vh-ih,offsetY));
}
function zoomAt(mx,my,factor){
  const old=scale;
  scale=Math.max(.2,Math.min(10,scale*factor));
  const ix=(mx-offsetX)/old,iy=(my-offsetY)/old;
  offsetX=mx-ix*scale;offsetY=my-iy*scale;clampPan();draw();
}

roiBtn.addEventListener('click',()=>{
  if(!imageReady)return;
  mode='perspective';
  perspectivePoints=[];
  roi=null;rectifiedCanvas=null;usePerspective=false;
  sampleModeBtn.disabled=true;confirmSampleBtn.disabled=true;analyzeBtn.disabled=true;
  roiBtn.classList.add('mode');sampleModeBtn.classList.remove('mode');
  crosshair.classList.remove('show');
  statusEl.textContent='請依序點：①左上 → ②右上 → ③右下 → ④左下';
  draw();
});

sampleModeBtn.addEventListener('click',()=>{
  if(!roi)return;
  mode='sample';crosshair.classList.add('show');
  sampleModeBtn.classList.add('mode');roiBtn.classList.remove('mode');
  confirmSampleBtn.disabled=false;
  statusEl.textContent='請拖曳照片，把一個完整未刮黑圈移到中央黃色準星。電腦可用滑鼠拖，手機可單指拖。';
});

function solveLinear(A,b){
  const n=b.length;
  const M=A.map((row,i)=>[...row,b[i]]);
  for(let col=0;col<n;col++){
    let pivot=col;
    for(let r=col+1;r<n;r++)if(Math.abs(M[r][col])>Math.abs(M[pivot][col]))pivot=r;
    [M[col],M[pivot]]=[M[pivot],M[col]];
    const d=M[col][col];
    if(Math.abs(d)<1e-10)throw new Error('透視點位置無法計算');
    for(let j=col;j<=n;j++)M[col][j]/=d;
    for(let r=0;r<n;r++){
      if(r===col)continue;
      const f=M[r][col];
      for(let j=col;j<=n;j++)M[r][j]-=f*M[col][j];
    }
  }
  return M.map((row,i)=>row[n]);
}
function homography4(src,dst){
  const A=[],b=[];
  for(let i=0;i<4;i++){
    const x=src[i].x,y=src[i].y,u=dst[i].x,v=dst[i].y;
    A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u);
    A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v);
  }
  const h=solveLinear(A,b);
  return [h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];
}
function applyH(H,x,y){
  const d=H[6]*x+H[7]*y+H[8];
  return {x:(H[0]*x+H[1]*y+H[2])/d,y:(H[3]*x+H[4]*y+H[5])/d};
}
function makeRectified(){
  if(perspectivePoints.length!==4)return;
  const [tl,tr,br,bl]=perspectivePoints;
  const top=Math.hypot(tr.x-tl.x,tr.y-tl.y);
  const bottom=Math.hypot(br.x-bl.x,br.y-bl.y);
  const left=Math.hypot(bl.x-tl.x,bl.y-tl.y);
  const right=Math.hypot(br.x-tr.x,br.y-tr.y);
  const W=Math.max(300,Math.round((top+bottom)/2));
  const Hh=Math.max(200,Math.round((left+right)/2));

  rectifiedCanvas=document.createElement('canvas');
  rectifiedCanvas.width=W;rectifiedCanvas.height=Hh;
  const rctx=rectifiedCanvas.getContext('2d',{willReadFrequently:true});

  const dst=[{x:0,y:0},{x:W-1,y:0},{x:W-1,y:Hh-1},{x:0,y:Hh-1}];
  // inverse mapping: destination -> original
  const inv=homography4(dst,perspectivePoints);

  const srcCanvas=document.createElement('canvas');
  srcCanvas.width=baseW;srcCanvas.height=baseH;
  const sctx2=srcCanvas.getContext('2d',{willReadFrequently:true});
  sctx2.drawImage(img,0,0);
  const srcData=sctx2.getImageData(0,0,baseW,baseH);
  const out=rctx.createImageData(W,Hh);

  for(let y=0;y<Hh;y++){
    for(let x=0;x<W;x++){
      const p=applyH(inv,x,y);
      const sx=Math.max(0,Math.min(baseW-1,Math.round(p.x)));
      const sy=Math.max(0,Math.min(baseH-1,Math.round(p.y)));
      const si=(sy*baseW+sx)*4,di=(y*W+x)*4;
      out.data[di]=srcData.data[si];
      out.data[di+1]=srcData.data[si+1];
      out.data[di+2]=srcData.data[si+2];
      out.data[di+3]=255;
    }
  }
  rctx.putImageData(out,0,0);
  usePerspective=true;
  roi={x:0,y:0,w:W,h:Hh};

  // Show rectified image as the working image. Keep original img in backup.
  const dataURL=rectifiedCanvas.toDataURL('image/jpeg',.94);
  const newImg=new Image();
  newImg.onload=()=>{
    img=newImg;baseW=W;baseH=Hh;
    perspectivePoints=[];
    fitImage();
    sampleModeBtn.disabled=false;
    roiBtn.classList.remove('mode');
    mode='pan';
    statusEl.textContent='✅ 透視校正完成。現在照片已拉正，接著選未刮樣本。';
    draw();
  };
  newImg.src=dataURL;
}

confirmSampleBtn.addEventListener('click',()=>{
  if(mode!=='sample'||!imageReady)return;
  const p=screenToImage(viewer.clientWidth/2,viewer.clientHeight/2);
  const cols=Math.max(1,parseInt(colsInput.value||10));
  const cellW=roi?roi.w/cols:baseW/cols;
  const size=Math.max(24,cellW*.65);
  const x=Math.max(0,Math.round(p.x-size/2)),y=Math.max(0,Math.round(p.y-size/2));
  const w=Math.min(Math.round(size),baseW-x),h=Math.min(Math.round(size),baseH-y);
  const tmp=document.createElement('canvas');tmp.width=baseW;tmp.height=baseH;
  const tctx=tmp.getContext('2d',{willReadFrequently:true});tctx.drawImage(img,0,0);
  const data=tctx.getImageData(x,y,w,h);
  template={data,x,y,w,h};
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').putImageData(data,0,0);
  sctx.clearRect(0,0,120,120);sctx.drawImage(c,0,0,120,120);
  sampleBox.classList.remove('hidden');sampleText.textContent=`已設定｜X ${Math.round(p.x)} / Y ${Math.round(p.y)}`;
  analyzeBtn.disabled=false;statusEl.textContent='✅ 未刮樣本已設定，可以開始辨識。';
});

function startAction(clientX,clientY){
  if(!imageReady)return;
  const rect=viewer.getBoundingClientRect(),sx=clientX-rect.left,sy=clientY-rect.top;

  if(mode==='perspective'){
    const p=screenToImage(sx,sy);
    if(p.x<0||p.y<0||p.x>baseW||p.y>baseH)return;
    perspectivePoints.push(p);
    const names=['左上','右上','右下','左下'];
    if(perspectivePoints.length<4){
      statusEl.textContent=`已設定 ${names[perspectivePoints.length-1]}。請點 ${perspectivePoints.length+1}：${names[perspectivePoints.length]}`;
      draw();
    }else{
      statusEl.textContent='正在進行透視校正…';
      draw();
      setTimeout(()=>{
        try{makeRectified();}
        catch(e){console.error(e);statusEl.textContent='❌ 透視校正失敗，請重新選四個角。';perspectivePoints=[];draw();}
      },30);
    }
    return;
  }

  if(mode==='roi'){
    roiStart=screenToImage(sx,sy);roiDrag={x:roiStart.x,y:roiStart.y,w:0,h:0};
  }else{
    mouseDown=true;lastMouse={x:clientX,y:clientY};canvas.classList.add('dragging');
  }
}
function moveAction(clientX,clientY){
  if(!imageReady)return;
  const rect=viewer.getBoundingClientRect(),sx=clientX-rect.left,sy=clientY-rect.top;
  if(mode==='roi'&&roiStart){
    const p=screenToImage(sx,sy);
    roiDrag={x:Math.min(roiStart.x,p.x),y:Math.min(roiStart.y,p.y),w:Math.abs(p.x-roiStart.x),h:Math.abs(p.y-roiStart.y)};
    draw();
  }else if(mouseDown&&lastMouse){
    offsetX+=clientX-lastMouse.x;offsetY+=clientY-lastMouse.y;lastMouse={x:clientX,y:clientY};clampPan();draw();
  }
}
function endAction(){
  if(mode==='roi'&&roiStart&&roiDrag){
    if(roiDrag.w>20&&roiDrag.h>20){
      roi=roiDrag;sampleModeBtn.disabled=false;statusEl.textContent='✅ 辨識範圍已設定。接著按「選未刮樣本」。';
    }else statusEl.textContent='框選範圍太小，請重新框選。';
    roiStart=null;roiDrag=null;roiBtn.classList.remove('mode');mode='pan';draw();
  }
  mouseDown=false;lastMouse=null;canvas.classList.remove('dragging');
}

// Desktop mouse
canvas.addEventListener('mousedown',e=>{e.preventDefault();startAction(e.clientX,e.clientY)});
window.addEventListener('mousemove',e=>{if(mouseDown||roiStart)moveAction(e.clientX,e.clientY)});
window.addEventListener('mouseup',()=>endAction());
canvas.addEventListener('wheel',e=>{
  if(!imageReady)return;e.preventDefault();
  const rect=viewer.getBoundingClientRect();zoomAt(e.clientX-rect.left,e.clientY-rect.top,e.deltaY<0?1.12:.89);
},{passive:false});

// Mobile pointer/touch
viewer.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;
  viewer.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1)startAction(e.clientX,e.clientY);
});
viewer.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'||!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const pts=[...pointers.values()];
  if(pts.length===1){moveAction(e.clientX,e.clientY);}
  else if(pts.length===2){
    mouseDown=false;roiStart=null;roiDrag=null;
    const[a,b]=pts,dist=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const rect=viewer.getBoundingClientRect();
    if(lastPinchDist&&lastMid){
      const old=scale,next=Math.max(.2,Math.min(10,scale*(dist/lastPinchDist)));
      const ix=(lastMid.x-rect.left-offsetX)/old,iy=(lastMid.y-rect.top-offsetY)/old;
      scale=next;offsetX=(mid.x-rect.left)-ix*scale;offsetY=(mid.y-rect.top)-iy*scale;clampPan();draw();
    }
    lastPinchDist=dist;lastMid=mid;
  }
});
function pointerEnd(e){
  if(e.pointerType==='mouse')return;
  pointers.delete(e.pointerId);
  if(pointers.size===0)endAction();
  if(pointers.size<2){lastPinchDist=0;lastMid=null;}
}
viewer.addEventListener('pointerup',pointerEnd);viewer.addEventListener('pointercancel',pointerEnd);

function stat(imageData){
  const d=imageData.data,vals=[];let dark=0,very=0,neutralDark=0,n=0;
  for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    const gray=.299*r+.587*g+.114*b, sat=mx===0?0:(mx-mn)/mx;
    vals.push(gray);n++;
    if(gray<105)dark++;
    if(gray<65)very++;
    if(gray<120 && sat<.30)neutralDark++;
  }
  vals.sort((a,b)=>a-b);
  const q=p=>vals[Math.min(vals.length-1,Math.max(0,Math.floor((vals.length-1)*p)))];
  // p20/p35 are intentionally used because glare mainly affects the brightest pixels.
  return{dark:dark/n,very:very/n,neutral:neutralDark/n,p20:q(.20),p35:q(.35),med:q(.50),p85:q(.85)};
}
function similarity(a,b){
  const A=stat(a),B=stat(b),glare=Number(glareRange.value);
  let loss;
  if(glare===0){
    loss=.30*Math.abs(A.dark-B.dark)+.18*Math.abs(A.very-B.very)+.12*Math.abs(A.neutral-B.neutral)
        +.16*Math.abs(A.p20-B.p20)/255+.12*Math.abs(A.p35-B.p35)/255+.12*Math.abs(A.med-B.med)/255;
  }else if(glare===1){
    loss=.34*Math.abs(A.dark-B.dark)+.22*Math.abs(A.very-B.very)+.16*Math.abs(A.neutral-B.neutral)
        +.18*Math.abs(A.p20-B.p20)/255+.10*Math.abs(A.p35-B.p35)/255;
  }else{
    loss=.36*Math.abs(A.dark-B.dark)+.25*Math.abs(A.very-B.very)+.18*Math.abs(A.neutral-B.neutral)
        +.17*Math.abs(A.p20-B.p20)/255+.04*Math.abs(A.p35-B.p35)/255;
  }
  return 1-loss;
}

function patchFromCanvas(octx,cx,cy,w,h){
  const sx=Math.max(0,Math.round(cx-w/2)), sy=Math.max(0,Math.round(cy-h/2));
  const sw=Math.max(1,Math.min(Math.round(w),baseW-sx));
  const sh=Math.max(1,Math.min(Math.round(h),baseH-sy));
  return octx.getImageData(sx,sy,sw,sh);
}

function darknessScore(im){
  const s=stat(im);
  // Search target: likely dark scratch-circle center. Lower percentiles make this resistant to glare.
  return s.dark*.48+s.very*.30+s.neutral*.12+(1-s.p20/255)*.10;
}


function centerDarkness(im){
  const d=im.data,w=im.width,h=im.height;
  let centerDark=0,centerN=0,edgeDark=0,edgeN=0;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
      const nx=(x+0.5)/w, ny=(y+0.5)/h;
      const inCenter = nx>.22 && nx<.78 && ny>.22 && ny<.78;
      if(inCenter){
        centerN++;
        if(g<115) centerDark++;
      }else{
        edgeN++;
        if(g<115) edgeDark++;
      }
    }
  }
  const c=centerN?centerDark/centerN:0;
  const e=edgeN?edgeDark/edgeN:0;
  // Intact round film should have a strong dark center.
  return {center:c,edge:e,contrast:c-e};
}

function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }


function ruptureCheck(im){
  const d=im.data,w=im.width,h=im.height;
  if(!w||!h)return {broken:false,holeRatio:0,largest:0};

  // Only inspect the inner part of the film. This avoids borders / grid lines.
  const x0=Math.floor(w*.20),x1=Math.ceil(w*.80);
  const y0=Math.floor(h*.20),y1=Math.ceil(h*.80);
  const iw=x1-x0, ih=y1-y0;
  const mask=new Uint8Array(iw*ih);

  let brightCount=0,total=0;
  for(let y=y0;y<y1;y++){
    for(let x=x0;x<x1;x++){
      const i=(y*w+x)*4;
      const r=d[i],g=d[i+1],b=d[i+2];
      const gray=.299*r+.587*g+.114*b;
      const maxc=Math.max(r,g,b),minc=Math.min(r,g,b);
      const chroma=maxc-minc;

      // A scratched opening usually exposes a continuous bright / colored / printed region.
      // A tiny specular highlight may be bright, but usually isn't a large connected region.
      const exposed = gray>148 || (gray>112 && chroma>42);
      const mi=(y-y0)*iw+(x-x0);
      if(exposed){mask[mi]=1;brightCount++;}
      total++;
    }
  }

  // Connected-component analysis of exposed regions.
  const seen=new Uint8Array(mask.length);
  let largest=0;
  const qx=new Int32Array(mask.length),qy=new Int32Array(mask.length);

  for(let yy=0;yy<ih;yy++){
    for(let xx=0;xx<iw;xx++){
      const idx=yy*iw+xx;
      if(!mask[idx]||seen[idx])continue;
      let head=0,tail=0,count=0;
      qx[tail]=xx;qy[tail]=yy;tail++;seen[idx]=1;

      while(head<tail){
        const x=qx[head],y=qy[head];head++;count++;
        const ns=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
        for(const [nx,ny] of ns){
          if(nx<0||ny<0||nx>=iw||ny>=ih)continue;
          const ni=ny*iw+nx;
          if(mask[ni]&&!seen[ni]){
            seen[ni]=1;
            qx[tail]=nx;qy[tail]=ny;tail++;
          }
        }
      }
      if(count>largest)largest=count;
    }
  }

  const holeRatio=total?brightCount/total:0;
  const largestRatio=total?largest/total:0;

  // Require a meaningful connected opening, not just scattered glare.
  const broken =
    largestRatio>=.075 ||
    (largestRatio>=.045 && holeRatio>=.14);

  return {broken,holeRatio,largest:largestRatio};
}


function adaptiveCircleSearch(octx,nominalX,nominalY,cellX,cellY,cw,ch,sampleW,sampleH,templateData,maxPercent){
  const templateStatLocal=stat(templateData);
  const templateCDLocal=centerDarkness(templateData);

  // Stages never exceed the user's selected maximum.
  const requested=Math.max(0,Number(maxPercent));
  const rawStages=[5,10,15].filter(v=>v<=requested);
  if(requested>0 && !rawStages.includes(requested)) rawStages.push(requested);
  if(requested===0) rawStages.push(0);
  rawStages.sort((a,b)=>a-b);

  const minCX=cellX+sampleW/2,maxCX=cellX+cw-sampleW/2;
  const minCY=cellY+sampleH/2,maxCY=cellY+ch-sampleH/2;

  let globalBest=null;

  for(const pct of rawStages){
    const range=pct/100;
    const maxDX=Math.min(cw*range,Math.max(0,(maxCX-minCX)/2));
    const maxDY=Math.min(ch*range,Math.max(0,(maxCY-minCY)/2));
    const dxs=maxDX>0?[-maxDX,-maxDX/2,0,maxDX/2,maxDX]:[0];
    const dys=maxDY>0?[-maxDY,-maxDY/2,0,maxDY/2,maxDY]:[0];

    let stageBest=null;

    for(const dx of dxs)for(const dy of dys){
      const cx=clamp(nominalX+dx,minCX,maxCX);
      const cy=clamp(nominalY+dy,minCY,maxCY);
      const im=patchFromCanvas(octx,cx,cy,sampleW,sampleH);
      const sim=similarity(im,templateData);
      const cd=centerDarkness(im);
      const st=stat(im);

      const distancePenalty=
        (Math.abs(cx-nominalX)/(cw||1)+Math.abs(cy-nominalY)/(ch||1))*.06;

      const score=
        sim*.62 +
        cd.center*.20 +
        Math.max(0,cd.contrast)*.10 +
        st.dark*.08 -
        distancePenalty;

      const candidate={x:cx,y:cy,data:im,sim,cd,st,score,pct};
      if(!stageBest || score>stageBest.score) stageBest=candidate;
      if(!globalBest || score>globalBest.score) globalBest=candidate;
    }

    if(stageBest){
      // Stop early only when the candidate is convincingly intact.
      // Otherwise expand 5 -> 10 -> 15.
      const centerRelative=templateCDLocal.center>0
        ? stageBest.cd.center/templateCDLocal.center : 0;
      const darkRelative=templateStatLocal.dark>0
        ? stageBest.st.dark/templateStatLocal.dark : 0;

      const highConfidence =
        stageBest.sim>=.79 &&
        centerRelative>=.72 &&
        darkRelative>=.60;

      if(highConfidence) return {...stageBest,highConfidence:true};
    }
  }

  return {...globalBest,highConfidence:false};
}

analyzeBtn.addEventListener('click',()=>{
  if(!roi||!template)return;

  const total=Math.max(1,parseInt(totalInput.value||60));
  const cols=Math.max(1,parseInt(colsInput.value||10));
  const rows=Math.ceil(total/cols);
  const shape=shapeMode.value;

  const off=document.createElement('canvas');
  off.width=baseW; off.height=baseH;
  const octx=off.getContext('2d',{willReadFrequently:true});
  octx.drawImage(img,0,0);

  overlay=[];
  let un=0,scr=0;

  const cw=roi.w/cols, ch=roi.h/rows;
  const glare=Number(glareRange.value);
  const templateStat=stat(template.data);

  // User setting is still respected, but every search point is strictly clamped
  // inside its own logical cell.
  const range = Number(searchRange.value)/100;

  for(let i=0;i<total;i++){
    const c=i%cols, r=Math.floor(i/cols);
    const cellX=roi.x+c*cw;
    const cellY=roi.y+r*ch;
    const nominalX=cellX+cw/2;
    const nominalY=cellY+ch/2;

    let bestX=nominalX, bestY=nominalY;

    if(shape==='circle'){
      // Same crop as P2, but search radius is now adaptive:
      // 5% first, then 10%, then 15% only when confidence is insufficient.
      const sampleW=Math.min(cw*.66, template.w*1.12);
      const sampleH=Math.min(ch*.66, template.h*1.12);

      const found=adaptiveCircleSearch(
        octx,nominalX,nominalY,cellX,cellY,cw,ch,
        sampleW,sampleH,template.data,Number(searchRange.value)
      );

      bestX=found.x; bestY=found.y;
      const data=found.data;
      const sim=found.sim;
      const ss=found.st;
      const cd=found.cd;
      const usedSearchPct=found.pct;

      const minDark=templateStat.dark*(glare===2?.38:glare===1?.46:.55);
      const templateCD=centerDarkness(template.data);

      // V1.3.9P3:
      // A truly intact black circle has an almost completely dark center.
      // On your test photo, intact cells such as 1-2 / 2-1 / 2-2 are near 100% dark
      // in the central area, while partially scratched circles are much lower.
      const centerThreshold =
        glare===0 ? Math.max(.78, templateCD.center*.78) :
        glare===1 ? Math.max(.68, templateCD.center*.68) :
                    Math.max(.58, templateCD.center*.58);

      const obviouslyIntact =
        cd.center >= centerThreshold &&
        ss.dark >= Math.max(.45, templateStat.dark*.45);

      // Keep the old similarity rule as a secondary path for intact circles affected by glare.
      const similarityIntact =
        sim>=.72 &&
        ss.dark>=Math.max(.07,minDark) &&
        cd.center >= (glare===2?.42:glare===1?.48:.54);

      let state=(obviouslyIntact || similarityIntact)?'un':'scr';

      // P2 second-stage check:
      // Even if V1.3.9 thinks this looks intact, reject it when there is a
      // sufficiently large connected exposed area inside the film.
      const rupture=ruptureCheck(data);
      if(state==='un' && rupture.broken) state='scr';

      if(state==='un')un++; else scr++;

      overlay.push({
        x:cellX,y:cellY,w:cw,h:ch,
        state,sim,
        matchX:bestX,matchY:bestY,
        centerDark:cd.center,
        rupture:rupture.largest,
        searchPct:usedSearchPct
      });

    }else{
      // Square mode: keep V1.3.7 behavior unchanged.
      const sampleW=cw*.62, sampleH=ch*.62;
      const squareRange=Math.min(Number(searchRange.value),5)/100;

      if(squareRange>0){
        const offsets=[-squareRange,0,squareRange];
        let best=-Infinity;
        for(const ox of offsets)for(const oy of offsets){
          const cx=nominalX+cw*ox, cy=nominalY+ch*oy;
          const im=patchFromCanvas(octx,cx,cy,sampleW,sampleH);
          const st=stat(im);
          const broadDark=st.dark*.55 + st.very*.25 + st.neutral*.20;
          const penalty=(Math.abs(ox)+Math.abs(oy))*.20;
          const score=broadDark-penalty;
          if(score>best){best=score;bestX=cx;bestY=cy;}
        }
      }

      const data=patchFromCanvas(octx,bestX,bestY,sampleW,sampleH);
      const ss=stat(data);
      const sim=similarity(data,template.data);

      const darkRatioOk = ss.dark >= Math.max(.12, templateStat.dark * (glare===2?.36:glare===1?.42:.50));
      const lowToneOk = ss.p20 <= Math.min(150, templateStat.p20 + (glare===2?75:glare===1?60:45));
      let state=(sim>=.70 && darkRatioOk && lowToneOk)?'un':'scr';
      const rupture=ruptureCheck(data);
      if(state==='un' && rupture.largest>=.09) state='scr';

      if(state==='un')un++; else scr++;

      overlay.push({
        x:cellX,y:cellY,w:cw,h:ch,state,sim,
        matchX:bestX,matchY:bestY,
        rupture:rupture.largest
      });
    }
  }

  rTotal.textContent=total;
  rDetected.textContent=overlay.length;
  rUn.textContent=un;
  rScr.textContent=scr;

  resultNote.textContent = shape==='circle'
    ? `V1.3.9P3 圓形模式：每格只在自己的格子內做 ±${searchRange.value}% 微調，定位改成「樣本相似度 + 中央黑色集中度」，不再單純追最黑區域。`
    : `V1.3.9P3 正方形模式：維持 V1.3.7 的穩定邏輯。`;

  resultCard.classList.remove('hidden');
  draw();
  resultCard.scrollIntoView({behavior:'smooth'});
});
window.addEventListener('resize',()=>{if(imageReady)fitImage()});
</script>
</body>
